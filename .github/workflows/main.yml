env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
name: Build All Found Dockerfiles

on:
  push:
    branches: [ "main" ]

jobs:
  # Job 1: Find all directories containing a Dockerfile
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Discover Dockerfile directories
        id: set-matrix
        run: |
          DIRS=$(find . -name "Dockerfile" -printf '%h\n' \
            | sed 's|^\./||' \
            | sort -u \
            | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=$DIRS" >> $GITHUB_OUTPUT

  # Job 2: Build and push each discovered image
  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # Let all matrix jobs run even if one fails
      matrix:
        directory: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive safe image tag
        id: tag
        run: |
          # Replace slashes with dashes so nested paths produce valid image names
          # e.g. "apps/api" -> "apps-api"
          SAFE_NAME=$(echo "${{ matrix.directory }}" | tr '/' '-')
          echo "name=${{ secrets.DOCKERHUB_USERNAME }}/${SAFE_NAME}:latest" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.directory }}
          file: ./${{ matrix.directory }}/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max